# ---------------------------------------------------------------------------
# Novara AI — budgets.yaml
# Single source of truth for every runtime magic number (development plan
# §2.10, Phase 1 leftover: QUOTA 300/4000, GLM 60s, context caps… collected).
# Loaded by src/lib/novara/content.ts with hard-coded defaults as fallback;
# team.yaml / skills.yaml are fail-fast (required), budgets degrade gracefully.
# ---------------------------------------------------------------------------

glm:
  timeoutMs: 60000            # per-call GLM timeout (matches withTimeout usage)
  routeMaxDuration: 90        # export const maxDuration on AI route handlers
  maxTurns: 3                 # bounded tool loop per task (Think→Tool→Observe ≤3)
  maxActionsPerTurn: 3        # novel-tool blocks per turn (plan §7.1)
  planMaxTasks: 44            # Atlas may not plan more than this (10-chapter QC runs need ~3 orders/chapter)
  leaderMaxTurns: 22          # Phase 5: Atlas delegate-loop turns per run (raised for multi-chapter runs)
  chapterContextChars: 24000  # max chapter text fed to GLM (review/sediment)
  chapterTailChars: 6000      # previous-chapter tail inside write context
  snapshotCastLimit: 12       # characters in the story snapshot
  snapshotOutlineLimit: 40    # outline beats in the story snapshot
  snapshotFactsLimit: 20      # story facts in the story snapshot
  repairRounds: 2             # write-verification repair rounds per task
  retryAttempts: 2            # Phase 6: retries for transient GLM errors (429/5xx/timeout)
  retryBackoffMs: 2500        # Phase 6: exponential backoff base (2.5s → 5s)
  maxConcurrent: 2            # Phase 6: global in-flight GLM call semaphore

qc:
  revisionRounds: 2           # Phase 6 E2: review→repair→re-review cycles per chapter (hard budget)
  approvalWaitMs: 1800000     # gate wait ceiling (30 min) before a gate times out

draft:
  quotaMinWords: 300          # QUOTA_MIN — chapter quota clamp floor
  quotaMaxWords: 4000         # QUOTA_MAX — chapter quota clamp ceiling
  avgChapterWordsSignal: 200  # min avg chapter length to trust as quota signal
  fallbackChapterWords: [500, 800]  # EN fallback range without signals
  appendFloorWords: 200       # append mode: minimum additional words

sse:
  snapshotIntervalMs: 1200    # server: DB poll interval while streaming
  heartbeatMs: 15000          # server: SSE comment keepalive
  staleRunMs: 900000          # 15 min without events → heal marks failed

client:
  fallbackPollMs: 2000        # browser polling fallback when SSE dies

prompt:
  systemPromptCapChars: 8000  # role card + skills concatenation cap
  taskBriefCapChars: 1800     # task envelope detail cap

memory:
  topK: 14                    # max scored memory items injected per draft
  contextBudgetChars: 2600    # char budget for the memory prompt block
  itemContentChars: 240       # per-item clip inside the block
  digestWindow: 3             # recent chapter digests injected verbatim
  digestSummaryChars: 500     # per-digest clip
  recencyHalfLifeChapters: 12 # chapters until an item's recency ≈ 0.75
  staleLoopChapters: 10       # doctor: open loop untouched for N chapters → warn

# Phase 2 — context compaction (agent-ctx/p2-design.md). Inert in every live
# run: enabled stays false until P2-c's confirmed probe. Eligibility keys off
# THIS section only — never off contextSpec (which decides system-note wire
# delivery exclusively).
contextCompaction:
  enabled: false        # master switch — shipped inert; flipped only in a P2-c probe run
  triggerTokens: 24000  # compact when the metered active context reaches this
  tailTurns: 8          # verbatim reply+tool_results turns kept after the cut
  minCompactableRows: 12 # never compact below this many coverable rows (absorption must pay for itself)
