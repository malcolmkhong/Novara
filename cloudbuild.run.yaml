steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_AI_PROVIDERS_ENABLED=gemini,NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyBTfZEZ3WLaTjk1fLRp1G_Ftf-20Gz2zdo,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=novara-514009.firebaseapp.com,NEXT_PUBLIC_FIREBASE_PROJECT_ID=novara-514009,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=novara-514009.firebasestorage.app,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=9073132203,NEXT_PUBLIC_FIREBASE_APP_ID=1:9073132203:web:e5c806f40b2c3f49f42dee
      - --build-arg=DATABASE_URL=postgresql://build:build@localhost:5432/build
      # Commit identity -> /api/health reports the live commit (GIT_SHA is
      # read at runtime, never inlined into the client bundle).
      - --build-arg=GIT_SHA=$COMMIT_SHA
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyBTfZEZ3WLaTjk1fLRp1G_Ftf-20Gz2zdo
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=novara-514009.firebaseapp.com
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=novara-514009
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=novara-514009.firebasestorage.app
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=9073132203
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=1:9073132203:web:e5c806f40b2c3f49f42dee
      - -t
      - asia-southeast1-docker.pkg.dev/novara-514009/novara/app:${BUILD_ID}
      - -t
      - asia-southeast1-docker.pkg.dev/novara-514009/novara/app:latest
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - asia-southeast1-docker.pkg.dev/novara-514009/novara/app
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - novara
      - --image=asia-southeast1-docker.pkg.dev/novara-514009/novara/app:${BUILD_ID}
      - --region=asia-southeast1
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --service-account=novara-run@novara-514009.iam.gserviceaccount.com
      - --set-env-vars=^;^GCP_PROJECT_ID=novara-514009;NODE_ENV=production;NEXT_PUBLIC_AI_PROVIDERS_ENABLED=gemini;GEMINI_WIRE_MODEL_FAST=google/gemini-3.8-flash;GEMINI_WIRE_MODEL_PRO=google/gemini-3.8-flash;NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyBTfZEZ3WLaTjk1fLRp1G_Ftf-20Gz2zdo;NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=novara-514009.firebaseapp.com;NEXT_PUBLIC_FIREBASE_PROJECT_ID=novara-514009;NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=novara-514009.firebasestorage.app;NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=9073132203;NEXT_PUBLIC_FIREBASE_APP_ID=1:9073132203:web:e5c806f40b2c3f49f42dee;ADMIN_UIDS=JFMmQdD9tbdEkWul5Z1qbZqHZcg1,hhDT4uqDnXRFHH30JJXN7j4gIjb2;GIT_SHA=$COMMIT_SHA
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      - --concurrency=80
      - --min-instances=0
      - --max-instances=3
timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
